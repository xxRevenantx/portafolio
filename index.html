<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f8faff" />
  <meta name="description" content="Carlos Alberto Núñez Pérez, desarrollador Full Stack. Proyectos con Laravel, React, TypeScript, APIs y aplicaciones offline-first." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Carlos Núñez | Desarrollador Full Stack" />
  <meta property="og:description" content="Software que resuelve problemas reales. Conoce mis proyectos de gestión académica y Nexo Alinura." />
  <meta name="robots" content="index, follow" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <title>Carlos Núñez | Desarrollador Full Stack</title>
  <script>
    (() => {
      try {
        // Light is the default. Only a theme explicitly chosen after this update overrides it.
        const saved = localStorage.getItem('portfolio-theme-choice');
        const theme = saved === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'light' ? '#f8faff' : '#081322');
      } catch {
        document.documentElement.dataset.theme = 'light';
        document.documentElement.style.colorScheme = 'light';
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
