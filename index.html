<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#081322" />
  <meta name="description" content="Carlos Alberto Núñez Pérez, desarrollador Full Stack. Proyectos con Laravel, React, TypeScript, APIs y aplicaciones offline-first." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Carlos Núñez | Desarrollador Full Stack" />
  <meta property="og:description" content="Software que resuelve problemas reales. Conoce mis proyectos de gestión académica y Nexo Alinura." />
  <meta name="robots" content="index, follow" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <title>Carlos Núñez | Desarrollador Full Stack</title>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('portfolio-theme');
        const light = saved === 'light' || (saved !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
        document.documentElement.style.colorScheme = light ? 'light' : 'dark';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', light ? '#f8faff' : '#081322');
      } catch {
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.style.colorScheme = 'dark';
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
